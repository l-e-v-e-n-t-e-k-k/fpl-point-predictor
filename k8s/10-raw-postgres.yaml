apiVersion: v1
kind: Service
metadata:
  name: raw-postgres
  namespace: fpl-system
spec:
  ports:
    - port: 5432
      targetPort: 5432
  selector:
    app: raw-postgres
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: raw-postgres
  namespace: fpl-system
spec:
  serviceName: raw-postgres
  replicas: 1
  selector:
    matchLabels:
      app: raw-postgres
  template:
    metadata:
      labels:
        app: raw-postgres
    spec:
      containers:
        - name: postgres
          image: postgres:15
          ports:
            - containerPort: 5432
          env:
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: fpl-secrets
                  key: POSTGRES_USER
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: fpl-secrets
                  key: POSTGRES_PASSWORD
            - name: POSTGRES_DB
              valueFrom:
                secretKeyRef:
                  name: fpl-secrets
                  key: RAW_DB_NAME
          volumeMounts:
            - name: raw-postgres-data
              mountPath: /var/lib/postgresql/data
          readinessProbe:
            exec:
              command: ["sh", "-c", "pg_isready -U $POSTGRES_USER -d $POSTGRES_DB"]
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            exec:
              command: ["sh", "-c", "pg_isready -U $POSTGRES_USER -d $POSTGRES_DB"]
            initialDelaySeconds: 30
            periodSeconds: 20
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
  volumeClaimTemplates:
    - metadata:
        name: raw-postgres-data
      spec:
        accessModes:
          - ReadWriteOnce
        resources:
          requests:
            storage: 2Gi
