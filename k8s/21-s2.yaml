apiVersion: v1
kind: Service
metadata:
  name: preprocessing
  namespace: fpl-system
spec:
  ports:
    - port: 8001
      targetPort: 8001
  selector:
    app: preprocessing
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: preprocessing
  namespace: fpl-system
spec:
  replicas: 1
  selector:
    matchLabels:
      app: preprocessing
  template:
    metadata:
      labels:
        app: preprocessing
    spec:
      containers:
        - name: preprocessing
          image: ghcr.io/l-e-v-e-n-t-e-k-k/fpl-s2:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8001
          env:
            - name: S2_DATABASE_URL
              value: postgresql://mluser:mlpass@feature-postgres:5432/featuredb
            - name: S1_BASE_URL
              value: http://raw-api:8002
            - name: FEATURE_TABLE_NAME
              valueFrom:
                configMapKeyRef:
                  name: fpl-config
                  key: FEATURE_TABLE_NAME
          readinessProbe:
            httpGet:
              path: /readyz
              port: 8001
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8001
            initialDelaySeconds: 20
            periodSeconds: 20
            timeoutSeconds: 5
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: "1"
              memory: 1Gi
