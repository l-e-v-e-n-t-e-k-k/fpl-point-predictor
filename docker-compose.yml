version: "3.9"

services:
  postgres:
    image: postgres:15
    container_name: fpl_postgres
    restart: always
    environment:
      POSTGRES_USER: mluser
      POSTGRES_PASSWORD: mlpass
      POSTGRES_DB: fpldb
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  api:
    build:
      context: .
      dockerfile: src/S4/Dockerfile
    container_name: fpl_api
    restart: unless-stopped
    depends_on:
      - postgres
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql://mluser:mlpass@postgres:5432/fpldb
      MODEL_BASE_DIR: /models
      MODEL_POLL_SECONDS: 10
    volumes:
      - ./models:/models

  trainer:
    build:
      context: .
      dockerfile: src/S3/Dockerfile
    container_name: fpl_trainer
    profiles:
      - trainer
    depends_on:
      - postgres
    environment:
      DATABASE_URL: postgresql://mluser:mlpass@postgres:5432/fpldb
      MODEL_BASE_DIR: /models
    volumes:
      - ./models:/models

volumes:
  postgres_data:
